    --spacing-bottom-pct: 0.07;
    --spacing-title-y-pct: 0.055;
    --accent-1: #fbbf24;
    --accent-2: #fb923c;
    --accent-3: #f87171;
    --accent-4: #a3e635;
    --accent-5: #4ade80;
    --accent-6: #d4a574;
}
:root[data-theme="dark"] {
    --background: #0f172a;
    --panel: #1e293b;
    --primary-text: #f1f5f9;
    --muted-text: #94a3b8;
